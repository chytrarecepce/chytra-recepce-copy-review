 salon\n*Rezervace* přímo na Instagramu\nSituace: Během ošetření není snadné odpovídat na zprávy. Klienti čekají a komunikace se přesouvá na večer.\nŘešení: AI odpoví na dotazy, nabídne termín a vytvoří rezervaci na Instagramu.\nPodrobnosti: Klient si v jednom rozhovoru ověří služby a ceny, vybere termín a objedná se. Potvrzení a připomínka pomohou připravit se na návštěvu.\nRozsah: AI recepční, Instagram, jeden rezervační systém, znalostní báze a připomínky.", "bRu": "Кабинет косметолога\nВопросы не мешают *работе с клиентом*\nЗадача: Новые обращения приходят, пока специалист занят на процедуре.\nРешение: AI помогает клиентам записываться, пока специалист работает.\nПодробности: Вопросы об услугах, свободное время и изменения записи можно решить в переписке. Необычные вопросы передаются специалисту.\nСостав: Общение и запись в рамках START.", "bCs": "Kosmetické studio\nDotazy neruší *péči o klienta*\nSituace: Nové zprávy přicházejí, zatímco se specialistka věnuje ošetření.\nŘešení: AI pomáhá klientům s rezervací, zatímco specialistka pracuje.\nPodrobnosti: Dotazy ke službám, volné termíny i změny rezervace lze vyřešit v chatu. Nestandardní dotazy převezme specialistka.\nRozsah: Komunikace a rezervace v rámci START.", "recommendation": "Длинное раскрытие 639–645 заменить этими короткими абзацами, а не повторять весь перечень функций. Не добавлять вымышленные «два косметолога», сроки ответа или объём потока.", "choices": ["Вариант А целиком", "Вариант B целиком", "RU — вариант А", "RU — вариант B", "CS — вариант А", "CS — вариант B", "Смешать варианты", "Оставить текущий текст", "Убрать этот элемент", "Использовать мой вариант ниже"], "selected": ""}, {"id": "R208", "row": "R208", "name": "Карточка 2 — коррекция вовремя", "numbers": "208,210,212,648,649,650,651", "currentRu": "Клиенты возвращаются на следующую процедуру", "currentCs": "", "aRu": "Клиенты планируют *следующий визит*\nЗадача: Клиент откладывает запись на коррекцию. Когда вспоминает о ней, удобное время ваются отдельно, по тарифам самих сервисов.", "currentCs": "", "aRu": "Внешние сервисы оплачиваются отдельно по тарифам их провайдеров.\nПоддержка после запуска\nТехническое сопровождение, помощь с обращениями и небольшие настройки. Условия и стоимость согласуем отдельно.", "aCs": "Externí služby se hradí samostatně podle ceníků poskytovatelů.\nPodpora po spuštění\nTechnická podpora, řešení požadavků a drobné úpravy nastavení. Podmínky a cenu dohodneme zvlášť.", "bRu": "Стоимость запуска не включает расходы на внешние сервисы и дальнейшее сопровождение.\nСопровождение системы\nОбсудим, какая поддержка нужна вашему салону после запуска.", "bCs": "Cena spuštění nezahrnuje externí služby ani následnou podporu.\nPrůběžná péče o systém\nProbereme, jakou podporu váš salon po spuštění potřebuje.", "recommendation": "А ближе к текущим условиям. B использовать, если дальнейшая поддержка действительно целиком вне цены. Не скрывать будущие расходы ради краткости.", "choices": ["Вариант А целиком", "Вариант B целиком", "RU — вариант А", "RU — вариант B", "CS — вариант А", "CS — вариант B", "Смешать варианты", "Оставить текущий текст", "Убрать этот элемент", "Использовать мой вариант ниже"], "selected": ""}, {"id": "R316", "row": "R316", "name": "Дополнения — сократить обзор", "numbers": "316,317,318,319,320,321,322,323,324,325,326,327,328,329,330,331,332,333,334", "currentRu": "Что можно добавить к любому тарифу", "currentCs": "", "aRu": "Расширьте решение под свои задачи\nДополнительные каналы, AI-помощники, маркетинговые воронки и интеграции. Состав и стоимость обсудим на консультации.", "aCs": "Rozšiřte řešení podle svých potřeb\nDalší kanály, AI asistenti, prodejní cesty a integrace. Rozsah a cenu probereme na konzultaci.", "bRu": "Дополнительные возможности\nОт голосового помощника до программ лояльности и онлайн-оплаты. Подберём нужные функции для вашего салона.", "bCs": "Další možnosti\nOd hlasového asistenta po věrnostní programy a online platby. Vybereme vhodné funkce pro váš salon.", "recommendation": "Рекомендую А вместо четырёх длинных списков; сам блок сохранить. Полный каталог раскрывать по кнопке. Если списки остаются: Voice AI → «Голосовой AI-помощник / Hlasový AI asistent»; Referral program → «Рекомендации друзьям / Program doporučení»; «Другие кастомные функции» → «Другие функции под ваши задачи / Další funkce na míru». Пункт «механики» заменить «дополнительные воронки».", "choices": ["Вариант А целиком", "Вариант B целиком", "RU — вариант А", "RU — вариант B", "CS — вариант А", "CS — вариант B", "Смешать варианты", "Оставить текущий текст", "Убрать этот элемент", "Использовать мой вариант ниже"], "selected": ""}]}, {"title": "11.1 Подробности тарифов", "entries": [{"id": "R659", "row": "R659", "name": "START — уточнения", "numbers": "659,660,662,663,669,675,677,679,680,684,686,687", "currentRu": "9 990 Kč, единоразово", "currentCs": "", "aRu": "Настройка и запуск AI-администратора для общения и записи в Instagram.\nКанал: Instagram Direct.\nПодключение: бизнес-аккаунт Instagram через Meta Business.\nСвободное время для записи.\nОдна CRM или система онлайн-записи: совместимость проверим до подключения.\nПодтверждения и напоминания по электронной почте.\nЕсли нужен специалист, AI-агент сообщает об этом клиенту и приостанавливает автоматические ответы. Уведомления администратору входят в Studio.\nДополнительно: другие каналы, AI-помощники, маркетинговые стратегии и воронки, дополнительные интеграции.", "aCs": "Nastavení a spuštění AI recepční pro komunikaci a rezervace na Instagramu.\nKanál: Instagram Direct.\nPropojení: firemní účet Instagramu přes Meta Business.\nVolné termíny k rezervaci.\nJeden CRM nebo rezervační systém: kompatibilitu ověříme před propojením.\nPotvrzení a připomínky e-mailem.\nPokud je potřeba specialista, AI agent to klientovi oznámí a pozastaví automatické odpovědi. Upozornění recepční jsou součástí Studia.\nMožnosti rozšíření: další kanály, AI asistenti, marketingové strategie a prodejní cesty, další integrace.", "bRu": "Всё для первого этапа автоматизации: ответы на вопросы и запись клиентов.\nВ тариф включён Instagram. Другие каналы можно добавить отдельно.\nПодключим ваш бизнес-аккаунт и систему записи после проверки совместимости.\nAI показывает доступное время, помогает записаться и отправляет подтверждения по почте.\nСложные вопросы можно продолжить со специалистом; автоматическое уведомление команды доступно в Studio.\nЧто можно добавить: дополнительные каналы связи, интеграции и возможности маркетинга.", "bCs": "Vše pro první krok automatizace: odpovědi na dotazy a rezervace klientů.\nTarif zahrnuje Instagram. Další kanály lze přidat samostatně.\nPo ověření kompatibility propojíme firemní účet a rezervační systém.\nAI ukáže volné termíny, pomůže s rezervací a pošle potvrzení e-mailem.\nSložité dotazy může převzít specialista; automatické upozornění týmu nabízí Studio.\nCo lze přidat: další komunikační kanály, integrace a marketingové funkce.", "recommendation": "А ближе к построчной замене; B — сокращённое раскрытие. Meta Business учитывать в техническом пункте по вашей заметке, не превращать в преимущество на карточке. Внешняя проверка требований Meta здесь не выполнялась. «Термин» по-русски заменить «время для записи», «окно» — в речи владельца.", "choices": ["Вариант А целиком", "Вариант B целиком", "RU — вариант А", "RU — вариант B", "CS — вариант А", "CS — вариант B", "Смешать варианты", "Оставить текущий текст", "Убрать этот элемент", "Использовать мой вариант ниже"], "selected": ""}, {"id": "R691", "row": "R691", "name": "STUDIO — компактное раскрытие", "numbers": "691,693,695,696,697,698,699,700,701,702,703,704,705,706,707,708,709,710,711,712,713,714", "currentRu": "Всё, что делает START, плюс контроль результата и маркетинг, который возвращает клиентов.", "currentCs": "", "aRu": "Всё из START и команда из четырёх AI-агентов для общения, аналитики и повседневных задач салона.\nAI-администратор помогает клиентам с вопросами и записью.\nПомощник администратора передаёт сложные вопросы вместе с историей разговора.\nАналитика показывает обращения, записи, конверсию, отмены и пропущенные визиты.\nЛичный помощник владельца отвечает на вопросы о салоне и присылает сводки в Telegram.\nМаркетинг: 3 стратегии, в каждой — 3 воронки на выбор. Продажи, повторные визиты и свободные окна.\nРасширенная база знаний: услуги, специалисты, цены и правила работы салона.\nНастройка под ваши правила и стиль общения. Тестирование, один согласованный цикл правок и запуск.\nДополнительно оплачиваются каналы сверх Instagram, дополнительные воронки и стратегии, AI-агенты сверх четырёх, дополнительные интеграции и отдельные процессы.", "aCs": "Vše ze START a tým čtyř AI agentů pro komunikaci, analytiku a každodenní úkoly salonu.\nAI recepční pomáhá klientům s dotazy a rezervacemi.\nAsistent recepční předá složité dotazy spolu s historií rozhovoru.\nAnalytika ukazuje dotazy, rezervace, konverzi, zrušené a zmeškané návštěvy.\nOsobní asistent majitele odpovídá na dotazy k provozu a posílá souhrny v Telegramu.\nMarketing: 3 strategie, v každé 3 prodejní cesty podle výběru. Prodej, opakované návštěvy a volné termíny.\nRozšířená znalostní báze: služby, specialisté, ceny a pravidla salonu.\nNastavení podle vašich pravidel a stylu komunikace. Testování, jedno dohodnuté kolo úprav a spuštění.\nSamostatně se hradí další kanály nad rámec Instagramu, další prodejní cesty a strategie, AI agenti nad rámec čtyř, další integrace a samostatné procesy.", "bRu": "Studio объединяет четыре роли: администратор для клиентов, помощник вашей команды, аналитик и личный ассистент владельца.\nВместе они помогают вести переписку, работать с записью, подключать специалиста и видеть результаты.\nТри маркетинговые стратегии настраиваются под ваш салон. В каждой выберите три воронки; дополнительные подключаются отдельно.\nВы получаете расширенную базу знаний, настройку правил, тестирование и запуск. Один согласованный цикл правок включён.\nЛичные боты в Telegram предназначены для вас и администратора. Общение с клиентами — в Instagram; другие каналы оплачиваются отдельно.\nДополнительные стратегии, воронки, агенты, интеграции и отдельные процессы рассчитываются отдельно.", "bCs": "Studio spojuje čtyři role: recepční pro klienty, asistenta týmu, analytika a osobního asistenta majitele.\nSpolečně pomáhají s komunikací, rezervacemi, zapojením specialisty a přehledem o výsledcích.\nTři marketingové strategie přizpůsobíme vašemu salonu. V každé vyberete tři prodejní cesty; další lze přidat samostatně.\nZískáte rozšířenou znalostní bázi, nastavení pravidel, testování a spuštění. Jedno dohodnuté kolo úprav je zahrnuto.\nOsobní Telegram boti slouží vám a recepční. Klientská komunikace probíhá na Instagramu; další kanály se hradí zvlášť.\nDalší strategie, prodejní cesty, agenti, integrace a samostatné procesy se kalkulují zvlášť.", "recommendation": "Рекомендую А: структура легко сканируется. Полные каталоги сегментов и механик 701–703 убрать из открытого доступа, заменив тремя целями. Коммерческие границы состава сохраняем. «Безопасное самообучение» здесь пока не добавлено: порядок обновления знаний не описан в материалах.", "choices": ["Вариант А целиком", "Вариант B целиком", "RU — вариант А", "RU — вариант B", "CS — вариант А", "CS — вариант B", "Смешать варианты", "Оставить текущий текст", "Убрать этот элемент", "Использовать мой вариант ниже"], "selected": ""}, {"id": "R716", "row": "R716", "name": "BUSINESS — раскрытие", "numbers": "716,720,721,722,723,725", "currentRu": "Кастомная разработка, когда один стандартный процесс записи не покрывает вашу задачу.", "currentCs": "", "aRu": "Индивидуальное решение для процессов, которые требуют особой настройки или разработки.\nСначала обсудим задачи, затем подготовим стоимость и план работ. В предложении отдельно покажем анализ, подключения, разработку, тестирование и запуск. Внешние сервисы оплачиваются отдельно. Изменения согласованного объёма оцениваются дополнительно.", "aCs": "Ind
